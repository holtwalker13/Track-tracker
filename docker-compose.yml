services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sap
      POSTGRES_PASSWORD: sap
      POSTGRES_DB: sap
    ports:
      # Host port 5433 avoids clashing with other local Postgres on 5432
      - "5433:5432"
    volumes:
      - sap-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sap -d sap"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Skip the production Next.js build locally (Railway uses the Dockerfile default).
        APP_MODE: ${APP_MODE:-development}
    ports:
      # Host port 3847 avoids clashing with other apps on 3000/3001
      - "3847:3000"
    environment:
      DATABASE_URL: "postgresql://sap:sap@postgres:5432/sap"
      SESSION_SECRET: "local-docker-dev-session-secret-min-32-chars"
      FORCE_SEED: "${FORCE_SEED:-0}"
      APP_MODE: "${APP_MODE:-development}"
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  sap-pg:
