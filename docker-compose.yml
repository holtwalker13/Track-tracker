services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:./dev.db"
      SESSION_SECRET: "local-docker-dev-session-secret-min-32-chars"
      # Set FORCE_SEED=1 to re-run demo seed (wipes are handled in seed script)
      FORCE_SEED: "${FORCE_SEED:-0}"
      APP_MODE: "${APP_MODE:-development}"
    volumes:
      # Persist SQLite DB between restarts
      - sap-db:/app/prisma
      # Optional: live code mount for local edits (uncomment on desktop)
      # - .:/app
      # - /app/node_modules

volumes:
  sap-db:
